name: Criar executavel do jogo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:

    runs-on: windows-latest

    steps:

      - name: Baixar codigo do repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Pygame
        run: |
          python -m pip install --upgrade pip
          pip install pygame

      - name: Instalar PyInstaller
        run: |
          pip install pyinstaller

      - name: Criar executavel
        run: |
          pyinstaller --onefile --windowed --name "A-Lenda-dos-Quatro-Elementos" rpg.py

      - name: Salvar executavel
        uses: actions/upload-artifact@v4
        with:
          name: A-Lenda-dos-Quatro-Elementos-Windows
          path: dist/A-Lenda-dos-Quatro-Elementos.exe
