 - name: Instalar Dependencias
        run: pip install pygame pyinstaller

      - name: Compilar com PyInstaller
        run: pyinstaller --onefile --windowed aetheria_rpg.py --name Aetheria

      - name: Upload do Artefato
        uses: actions/upload-artifact@v4
        with:
          name: Aetheria-EXE
          path: dist/Aetheria.exe
